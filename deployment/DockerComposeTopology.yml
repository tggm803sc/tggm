services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tgg}
      POSTGRES_USER: ${POSTGRES_USER:-tgg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - tgg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tgg} -d ${POSTGRES_DB:-tgg}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tgg_backend]

  web:
    build:
      context: ../tgg-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks: [tgg_backend, tgg_edge]

volumes:
  tgg_postgres_data:

networks:
  tgg_backend:
    internal: true
  tgg_edge:
