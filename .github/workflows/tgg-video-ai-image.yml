name: TGG Video AI Immutable Image

on:
  push:
    branches:
      - feature/tgg-video-ai-engine
    paths:
      - 'tgg-video-ai/**'
      - '.github/workflows/tgg-video-ai-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tgg-video-ai/Dockerfile
          push: true
          build-args: |
            TGG_BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/tggm803sc/tggm-video-ai:${{ github.sha }}
