name: TGG Video AI Browser Proof

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Public TGG production origin, e.g. https://tgg.example.com"
        required: true
        type: string

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TGG_PROD_ORIGIN: ${{ inputs.origin }}
      TGG_VIDEO_AI_EXPECTED_SHA: 469518eff0fe1641f6889c5ff78c2f3c0df189c7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tgg-video-ai-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run public Video Studio proof
        run: node release-ops/tgg-video-ai-browser-proof.mjs
