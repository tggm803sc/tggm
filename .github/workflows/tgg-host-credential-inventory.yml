name: TGG Host Credential Inventory

on:
  push:
    branches:
      - feature/tgg-video-ai-engine
    paths:
      - '.github/workflows/tgg-host-credential-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TGG_GPU_HOST: ${{ secrets.TGG_GPU_HOST }}
      TGG_GPU_USER: ${{ secrets.TGG_GPU_USER }}
      TGG_GPU_SSH_PRIVATE_KEY: ${{ secrets.TGG_GPU_SSH_PRIVATE_KEY }}
      TGG_HOST: ${{ secrets.TGG_HOST }}
      TGG_HOST_USER: ${{ secrets.TGG_HOST_USER }}
      TGG_HOST_SSH_PRIVATE_KEY: ${{ secrets.TGG_HOST_SSH_PRIVATE_KEY }}
      TGG_PROD_HOST: ${{ secrets.TGG_PROD_HOST }}
      TGG_PROD_USER: ${{ secrets.TGG_PROD_USER }}
      TGG_PROD_SSH_PRIVATE_KEY: ${{ secrets.TGG_PROD_SSH_PRIVATE_KEY }}
      TGG_SERVER_HOST: ${{ secrets.TGG_SERVER_HOST }}
      TGG_SERVER_USER: ${{ secrets.TGG_SERVER_USER }}
      TGG_SERVER_SSH_PRIVATE_KEY: ${{ secrets.TGG_SERVER_SSH_PRIVATE_KEY }}
      COOLIFY_HOST: ${{ secrets.COOLIFY_HOST }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tgg-video-ai-engine
          fetch-depth: 0

      - name: Record secret-name availability only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,os
          from pathlib import Path
          names=[
            "TGG_GPU_HOST","TGG_GPU_USER","TGG_GPU_SSH_PRIVATE_KEY",
            "TGG_HOST","TGG_HOST_USER","TGG_HOST_SSH_PRIVATE_KEY",
            "TGG_PROD_HOST","TGG_PROD_USER","TGG_PROD_SSH_PRIVATE_KEY",
            "TGG_SERVER_HOST","TGG_SERVER_USER","TGG_SERVER_SSH_PRIVATE_KEY",
            "COOLIFY_HOST","COOLIFY_TOKEN",
          ]
          present=[n for n in names if os.environ.get(n)]
          missing=[n for n in names if not os.environ.get(n)]
          Path("deployment/tgg-host-credential-inventory.json").write_text(json.dumps({
            "schema":"tgg.host-credential-inventory.v1",
            "mode":"PRESENCE_ONLY",
            "checkedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "presentCredentialNames":present,
            "missingCredentialNames":missing,
          },indent=2)+"\n")
          PY

      - name: Commit sanitized inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TGG Host Inventory"
          git config user.email "tgg-host-inventory@users.noreply.github.com"
          git add deployment/tgg-host-credential-inventory.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops: record TGG host credential availability"
          git push origin HEAD:feature/tgg-video-ai-engine
